<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Animação HTML Canvas</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 2px solid #333;
            background-color: #ffffff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="CanvasA" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('CanvasA');
        const ctx = canvas.getContext('2d');

        let x = 100, y = 100;
        let velX = 7, velY = 5;
        const raio = 40;

        const cores = ['purple', 'orange', 'red', 'blue', 'green'];
        let corAtual = 0;

        function animar() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.beginPath();
            ctx.arc(x, y, raio, 0, Math.PI * 2);
            ctx.fillStyle = cores[corAtual];
            ctx.fill();

            x += velX;
            y += velY;

            if (x + raio > canvas.width || x - raio < 0) velX = -velX;
            if (y + raio > canvas.height || y - raio < 0) velY = -velY;

            requestAnimationFrame(animar);
        }

        canvas.addEventListener('click', () => {
            corAtual = (corAtual + 1) % cores.length;
        });

        animar();
    </script>
</body>
</html>
